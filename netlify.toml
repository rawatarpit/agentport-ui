# Netlify — AgentPort console (Next.js 14 App Router).
#
# Build: npm run build (must typecheck cleanly — see AGENTS.md gate).
# Deploy preview per PR; production from main.
#
# REQUIRED in Netlify site settings (never in this file):
#   AGENTPORT_SIGNING_SECRET  — HMAC key (server-only)
#   NEXT_PUBLIC_SUPABASE_URL + NEXT_PUBLIC_SUPABASE_ANON_KEY — public project
#   identifiers (anon only; never service-role or access tokens).
#
# NOTE on `@agentport/sdk`: it is vendored at `vendor/agentport-sdk`
# (prebuilt `dist` snapshot of the SDK repo) and consumed as
# `file:./vendor/agentport-sdk`, so this build is self-contained — no sibling
# checkout, no publish step. Refresh the snapshot by re-copying `dist` (and
# `package.json`) from the SDK repo after its own `npm run verify` passes.
#
# Netlify runs NO backend here: no ingest, no sync, no sessions, no reads.
# Every edge/server function it bundles (`server-handler`, middleware) is the
# UI serving itself — pages, auth redirects, and the dashboard's own
# authoring APIs. Runtime traffic goes to Supabase edge functions directly;
# the data plane never touches this host.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # The two NEXT_PUBLIC_ values are public project identifiers by design
  # (they ship in client JavaScript; RLS protects the data). GITHUB_APP_ID
  # and GITHUB_CLIENT_ID are likewise public identifiers — GitHub shows them
  # on the App settings page to anyone who can see the App, and the client
  # ID rides in OAuth URLs. The scanner cannot tell either class from a
  # leaked secret, so they are named here explicitly. This omits keys, never
  # values, and changes nothing about what ships. Private key, client
  # secret, and webhook secret are NOT omitted: if any of those ever matches
  # a file, the build must fail.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, GITHUB_APP_ID, GITHUB_CLIENT_ID"

# Next.js App Router needs the Essential Next.js plugin on Netlify.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers for an enterprise console. CSP stays loose enough for
# Next.js inline runtime; tighten script-src with nonces if this becomes strict.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
